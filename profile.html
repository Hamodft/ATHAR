</style><link rel="icon" type="image/svg+xml" href="/favicon.svg"></head><body><header><a href="/" class="logo" style="text-decoration:none;color:inherit"><img class="brand-mark" src="/brand/athar-green.svg" width="79" height="68" alt="أثر"></a><a href="/" class="secondary" style="text-decoration:none">اصنع صفحتك</a></header><main style="max-width:1200px;padding-top:28px"><p class="mini" style="background:#eee6d4;padding:12px 18px;border-radius:12px">نموذج توضيحي · جميع الأسماء والجهات والخبرات في هذه الصفحة افتراضية.</p><div id="sample"></div><div class="actions"><a href="/" class="primary" style="text-decoration:none">خلّنا نبدأ قصتك ←</a><button class="secondary" onclick="window.print()">اطبع النموذج</button></div></main><script>const data={"name": "سارة", "goal": "أبحث عن فرصة في خدمة العملاء", "work": "أعمل في خدمة العملاء ومتابعة الطلبات. أحرص على فهم ما يحتاجه العميل وشرح الخطوات بوضوح، وأتابع مع الفريق حتى تصل المعلومة الصحيحة للعميل.", "city": "الرياض", "experiences": [{"role": "منسقة خدمة عملاء", "organization": "متجر تجريبي", "period": "٢٠٢٣ – حتى الآن", "description": "أستقبل استفسارات العملاء وأتابع حالة الطلبات مع الفريق. أوضح مواعيد الاستلام وأرتب الملاحظات حتى يسهل الرجوع إليها."}, {"role": "متطوعة في تنظيم الفعاليات", "organization": "مبادرة مجتمعية افتراضية", "period": "٢٠٢٢", "description": "شاركت في استقبال الزوار وتوجيههم، وتنسيق المهام مع بقية المتطوعين."}], "moment": "تواصل معنا عميل بسبب تأخر طلبه، وكان يحتاج يعرف موعد وصوله قبل سفره.", "momentDetail": "راجعت حالة الطلب مع الفريق، وتواصلت مع العميل لشرح الموعد المتاح والخطوة التالية دون تقديم وعد غير مؤكد.", "education": "دبلوم إدارة أعمال\nكلية افتراضية · قيد الدراسة", "courses": "تعلّم ذاتي في تنظيم الجداول ومتابعة الطلبات.", "skills": "متابعة الطلبات، شرح الخطوات، تنظيم الملاحظات، العمل مع الفريق", "email": "", "phone": ""};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function professionalPreview(){
const hasExperience=data.experiences.length>0;const hasLearning=!!(data.education||data.courses);const chips=data.skills.split(/[،,;؛\n]+/).map(x=>x.trim()).filter(Boolean);const title=hasExperience?data.experiences[0].role:'';
return `<article class="professional-page"><header class="profile-cover"><div><span class="cover-kicker">مساحة تعرفك</span><h2>${esc(data.name||'اسمك هنا')}</h2>${title?`<p class="cover-title">${esc(title)}</p>`:''}<div class="cover-meta">${data.city?`<span>${esc(data.city)}</span>`:''}${data.goal?`<span>${esc(data.goal)}</span>`:''}</div></div><div class="cover-initial" aria-hidden="true">${esc((data.name||'أ').slice(0,1))}</div></header><nav class="profile-nav" aria-label="أقسام صفحتك"><a href="#profile-about">عنّي</a>${hasExperience?'<a href="#profile-experience">الخبرات</a>':''}${data.moment?'<a href="#profile-story">من تجربتي</a>':''}${hasLearning?'<a href="#profile-learning">التعلّم</a>':''}</nav><div class="profile-grid"><div><section id="profile-about" class="profile-section"><h3 class="section-label">عنّي</h3><p>${esc(data.work)}</p></section>${hasExperience?`<section id="profile-experience" class="profile-section"><h3 class="section-label">الخبرة العملية</h3>${data.experiences.map(e=>`<article class="experience-entry"><h4>${esc(e.role)}</h4>${e.organization?`<p class="experience-org">${esc(e.organization)}</p>`:''}${e.period?`<p class="experience-period">${esc(e.period)}</p>`:''}${e.description?`<p>${esc(e.description)}</p>`:''}</article>`).join('')}</section>`:''}${data.moment?`<section id="profile-story" class="profile-section"><h3 class="section-label">موقف من تجربتي</h3><div class="proof-card"><p>${esc(data.moment)}</p>${data.momentDetail?`<h4>مساهمتي في الموقف</h4><p>${esc(data.momentDetail)}</p>`:''}</div></section>`:''}</div><aside class="profile-aside">${hasLearning?`<section id="profile-learning" class="profile-section">${data.education?`<h3 class="section-label">التعليم</h3><p>${esc(data.education)}</p>`:''}${data.courses?`<h3 class="section-label">الدورات والتعلّم</h3><p>${esc(data.courses)}</p>`:''}</section>`:''}${chips.length?`<section class="profile-section"><h3 class="section-label">ما أجيده</h3><div class="skill-chips">${chips.map(t=>`<span>${esc(t)}</span>`).join('')}</div></section>`:''}${data.email||data.phone?`<details class="private-contact"><summary>معلومات التواصل · خاصة</summary>${data.email?`<p dir="ltr">${esc(data.email)}</p>`:''}${data.phone?`<p dir="ltr">${esc(data.phone)}</p>`:''}<p>تختار ما يظهر للآخرين قبل النشر.</p></details>`:''}${!hasLearning&&!chips.length&&!data.email&&!data.phone?'<p class="profile-empty">تظهر هنا تفاصيل تعليمك وما تجيده، عندما تضيفها.</p>':''}</aside></div><div class="page-signature"><span>بكلامك أنت. وبصورة تليق بك.</span><img class="brand-signature" src="/brand/athar-green.svg" width="35" height="30" alt="أثر"></div></article>`}
document.getElementById('sample').innerHTML=professionalPreview();</script></body></html>
