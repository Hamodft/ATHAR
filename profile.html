<!doctype html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>جرّب شكل صفحتك المهنية — أثر</title>
 <meta name="description" content="نموذج توضيحي لصفحة أثر المهنية مع تجربة تغيير التصميم والألوان والخط.">
 <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/portfolio.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg">
 <style>
 .demo-page{max-width:1320px;padding:30px 4%;margin:auto}.demo-intro{display:flex;align-items:start;justify-content:space-between;gap:28px;margin-bottom:28px}.demo-intro h1{font-size:clamp(26px,3vw,40px);line-height:1.5;margin:0 0 12px}.demo-intro p{font-size:14px;line-height:1.9;max-width:650px;margin:0}.demo-controls{display:flex;flex-wrap:wrap;gap:18px;padding:22px;margin-bottom:24px;background:#fffefa;border:1px solid #d9dfd2;border-radius:14px}.demo-controls label{font-size:12px;display:flex;flex-direction:column;gap:8px;flex:1 1 145px}.demo-controls select{font:inherit;min-height:44px;padding:10px;border:1px solid #c7d1c1;border-radius:7px;background:white;color:#23483c}.demo-status{font-size:12px;line-height:1.8;margin:12px 0 0;min-height:24px}.demo-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}.demo-toolbar a{font-size:13px}@media(max-width:600px){.demo-intro{display:block}.demo-intro>a{margin-top:20px}.demo-page{padding:24px 4%}.demo-controls{padding:16px;gap:12px}}@media print{.demo-intro,.demo-controls,.demo-toolbar,.demo-status,body>header,body>footer{display:none!important}.demo-page{padding:0;max-width:none}}
 </style>
</head>
<body>
 <header><a href="/" class="logo" style="color:inherit;text-decoration:none"><img class="brand-mark" src="/brand/athar-green.svg" width="79" height="68" alt="أثر"></a><a class="secondary" href="/">ابدأ صفحتك</a></header>
 <main class="demo-page">
  <div class="demo-intro"><div><h1>حضور مهني، بتصميم تختاره.</h1><p>هذا مثال توضيحي بشخصية ومعلومات افتراضية. جرّب القالب واللون والخط؛ صفحتك ستعرض معلوماتك التي تراجعها وتعتمدها.</p></div><a class="primary" href="/">ابنِ صفحتك بمعلوماتك</a></div>
  <form class="demo-controls" aria-label="تجربة تعديل التصميم">
   <label for="demo-layout">القالب<select id="demo-layout"><option value="portfolio">حضور مهني · داكن</option><option value="portfolio-light">حضور مهني · فاتح</option><option value="classic">الكلاسيكي</option><option value="minimal">البسيط</option><option value="sidebar">الجانبي</option></select></label>
   <label for="demo-theme">اللون<select id="demo-theme"><option value="navy">كحلي وذهبي</option><option value="forest">أخضر وذهبي</option><option value="sand">ترابي ودافئ</option></select></label>
   <label for="demo-font">الخط<select id="demo-font"><option value="tahoma">واضح · Tahoma</option><option value="arial">بسيط · Arial</option><option value="serif">تقليدي · Serif</option></select></label>
   <label for="demo-density">المسافات<select id="demo-density"><option value="comfortable">مساحات مريحة</option><option value="compact">تنسيق متقارب</option></select></label>
   <label for="demo-order">ترتيب الأقسام<select id="demo-order"><option value="experience-first">الخبرات ثم المساهمة</option><option value="story-first">المساهمة ثم الخبرات</option></select></label>
  </form>
  <div id="portfolio-demo"></div>
  <p id="demo-status" class="demo-status" role="status">تغييرات هذا المثال للمعاينة فقط؛ لا تغيّر مسودتك أو أي صفحة منشورة.</p>
  <div class="demo-toolbar"><a href="/">ابدأ بالأسئلة</a><a href="/import-cv">استورد سيرتك الجاهزة</a><a href="/design">عدّل تصميم مسودتك</a></div>
 </main>
 <script src="/profile-renderer.js"></script><script type="module" src="/assets/profile-demo.js"></script>
</body>
</html>
