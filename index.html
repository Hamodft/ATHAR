.preview-mode .flow{max-width:1060px}.preview-mode .progress{max-width:700px;margin:15px auto 30px}.preview-intro{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.preview-intro h2{margin:8px 0;font-size:28px}.private-badge{font-size:12px;white-space:nowrap;border:1px solid #ced8ce;border-radius:24px;padding:10px 16px}.professional-page{background:#fffefa;border:1px solid #d9dfd2;border-radius:24px;overflow:hidden;box-shadow:0 16px 55px #23483c0c}.profile-cover{max-width:none;margin:0;border:0;background:#1e4236;color:#fffefa;padding:46px 48px;display:grid;grid-template-columns:1fr auto;gap:28px;position:relative;overflow:hidden}.profile-cover:after{content:'';position:absolute;width:340px;height:340px;border:1px solid #ffffff12;border-radius:50%;left:-100px;top:-160px;box-shadow:0 0 0 45px #ffffff05,0 0 0 90px #ffffff03;pointer-events:none}.cover-kicker{font-size:12px;color:#d8c5a1;letter-spacing:1px}.profile-cover h2{font-size:clamp(32px,5vw,52px);font-weight:bold;line-height:1.4;margin:16px 0 8px;overflow-wrap:anywhere}.cover-title{font-size:19px;color:#e0e8dc;margin:0}.cover-meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}.cover-meta span{font-size:12px;border:1px solid #ffffff25;padding:8px 13px;border-radius:24px}.cover-initial{width:100px;height:122px;background:#e1d9c5;color:#23483c;border-radius:46px 46px 14px 14px;display:grid;place-items:center;font-size:44px;font-weight:normal;position:relative;z-index:1;align-self:center}.profile-nav{padding:0 40px;border-bottom:1px solid #e8eadf;display:flex;flex-wrap:wrap;gap:24px;background:#f4f5ed}.profile-nav a{padding:17px 0;font-size:13px;text-decoration:none;color:#52685b;border-bottom:2px solid transparent}.profile-nav a:hover{border-color:#ae8156;color:#23483c}.profile-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr);gap:40px;padding:38px 40px}.profile-section{margin-bottom:34px;scroll-margin-top:20px;min-width:0}.section-label{display:flex;gap:12px;align-items:center;font-size:16px;margin:0 0 17px;font-weight:bold}.section-label:before{content:'';height:14px;width:3px;background:#b38a5c;border-radius:3px}.professional-page p{font-size:15px;line-height:2;color:#53685c;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.experience-entry{position:relative;border-right:1px solid #dce2d6;padding:0 21px 24px 0}.experience-entry:last-child{padding-bottom:0}.experience-entry:before{content:'';position:absolute;width:9px;height:9px;background:#b38a5c;border:3px solid #fffefa;box-shadow:0 0 0 1px #c8d2c1;border-radius:50%;right:-5px;top:8px}.experience-entry h4{font-size:18px;margin:0 0 8px}.professional-page .experience-period{font-size:12px;color:#8a765c}.professional-page .experience-org{font-size:14px;color:#23483c}.proof-card{border:1px solid #e3ddcd;background:#f6f3e9;padding:24px;border-radius:15px}.proof-card h4{font-size:13px;color:#8a765c;font-weight:normal;margin:20px 0 7px}.proof-card p{margin:0}.profile-aside{border-right:1px solid #e4e8dc;padding-right:30px}.skill-chips{display:flex;flex-wrap:wrap;gap:8px}.skill-chips span{font-size:13px;line-height:1.8;background:#edf0e7;padding:7px 12px;border-radius:10px;max-width:100%;overflow-wrap:anywhere}.private-contact{font-size:13px;background:#f2f3eb;padding:18px;border-radius:12px}.private-contact summary{cursor:pointer;line-height:1.8}.private-contact p{font-size:13px}.page-signature{border-top:1px solid #e7e9df;padding:18px 40px;display:flex;justify-content:space-between;gap:20px;color:#8a9286;font-size:11px}.preview-actions{padding-top:7px}.preview-note{font-size:12px!important;margin-top:20px}.preview-mode main{max-width:1280px}.professional-page .profile-empty{font-size:13px;color:#7c887b}

const app=document.getElementById('app');let data={name:'',goal:'',work:'',moment:'',momentDetail:'',headline:''},step=0;try{Object.assign(data,JSON.parse(localStorage.getItem('athar-draft-v1')||'{}'))}catch(e){};data.wording=data.wording&&typeof data.wording==='object'?data.wording:{};['name','goal','work','moment','momentDetail'].forEach(k=>{if(typeof data[k]!=='string')data[k]=''});const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('athar-draft-v1',JSON.stringify(data));document.getElementById('save-warning').hidden=true;return true}catch(e){document.getElementById('save-warning').hidden=false;return false}}function shell(content){return `<section class="flow"><button class="plain" id="back">→ رجوع</button><div class="progress" aria-label="تقدم التجربة"><i style="width:${step<=5?step/5*100:(step-5)/11*100}%"></i></div>${content}<p class="error" id="error" role="alert"></p></section>`}function normaliseProfile(){for(const k of ['education','courses','skills','email','phone','city'])if(typeof data[k]!=='string')data[k]='';if(!Array.isArray(data.experiences))data.experiences=[];if(!data.experienceDraft||typeof data.experienceDraft!=='object')data.experienceDraft={};for(const k of ['role','organization','period','description'])if(typeof data.experienceDraft[k]!=='string')data.experienceDraft[k]=''}
function profileQuestion(title,key,hint,max=1500,type='text'){const value=key.startsWith('exp-')?data.experienceDraft[key.slice(4)]:data[key];return `<span class="eyebrow">نكمل تفاصيل صفحتك · على راحتك</span><h2>${title}</h2><label for="${key}">${hint}</label>${max>300?`<textarea id="${key}" class="field" maxlength="${max}">${esc(value)}</textarea>`:`<input id="${key}" class="field" type="${type}" maxlength="${max}" value="${esc(value)}" ${type==='email'||type==='tel'?'dir="ltr"':''}>`}<div class="actions"><button class="primary" id="profile-next">نكمل ←</button><button class="plain" id="profile-skip">أضيفها بعدين</button></div>`}
function extraPreview(){return `${data.experiences.length?`<h3>خبراتي</h3>${data.experiences.map(e=>`<article><h4>${esc(e.role)}</h4><p>${esc([e.organization,e.period].filter(Boolean).join(' · '))}</p><p>${esc(e.description)}</p></article>`).join('')}`:''}${[['education','تعليمي'],['courses','الدورات والتعلّم'],['skills','ما أجيده'],['city','المدينة']].map(([k,title])=>data[k]?`<h3>${title}</h3><p>${esc(data[k])}</p>`:'').join('')}${data.email||data.phone?`<details><summary>معلومات التواصل الخاصة في مسودتي</summary><p>${esc(data.email)}</p><p>${esc(data.phone)}</p><p class="mini">لم تُنشر هذه المعلومات. ستختار ما يظهر للآخرين قبل النشر.</p></details>`:''}`}
function professionalPreview(){
const hasExperience=data.experiences.length>0;const hasLearning=!!(data.education||data.courses);const chips=data.skills.split(/[،,;؛\n]+/).map(x=>x.trim()).filter(Boolean);const title=hasExperience?data.experiences[0].role:'';
return `<article class="professional-page"><header class="profile-cover"><div><span class="cover-kicker">مساحة تعرفك</span><h2>${esc(data.name||'اسمك هنا')}</h2>${title?`<p class="cover-title">${esc(title)}</p>`:''}<div class="cover-meta">${data.city?`<span>${esc(data.city)}</span>`:''}${data.goal?`<span>${esc(data.goal)}</span>`:''}</div></div><div class="cover-initial" aria-hidden="true">${esc((data.name||'أ').slice(0,1))}</div></header><nav class="profile-nav" aria-label="أقسام صفحتك"><a href="#profile-about">عنّي</a>${hasExperience?'<a href="#profile-experience">الخبرات</a>':''}${data.moment?'<a href="#profile-story">من تجربتي</a>':''}${hasLearning?'<a href="#profile-learning">التعلّم</a>':''}</nav><div class="profile-grid"><div><section id="profile-about" class="profile-section"><h3 class="section-label">عنّي</h3><p>${esc(data.work)}</p></section>${hasExperience?`<section id="profile-experience" class="profile-section"><h3 class="section-label">الخبرة العملية</h3>${data.experiences.map(e=>`<article class="experience-entry"><h4>${esc(e.role)}</h4>${e.organization?`<p class="experience-org">${esc(e.organization)}</p>`:''}${e.period?`<p class="experience-period">${esc(e.period)}</p>`:''}${e.description?`<p>${esc(e.description)}</p>`:''}</article>`).join('')}</section>`:''}${data.moment?`<section id="profile-story" class="profile-section"><h3 class="section-label">موقف من تجربتي</h3><div class="proof-card"><p>${esc(data.moment)}</p>${data.momentDetail?`<h4>مساهمتي في الموقف</h4><p>${esc(data.momentDetail)}</p>`:''}</div></section>`:''}</div><aside class="profile-aside">${hasLearning?`<section id="profile-learning" class="profile-section">${data.education?`<h3 class="section-label">التعليم</h3><p>${esc(data.education)}</p>`:''}${data.courses?`<h3 class="section-label">الدورات والتعلّم</h3><p>${esc(data.courses)}</p>`:''}</section>`:''}${chips.length?`<section class="profile-section"><h3 class="section-label">ما أجيده</h3><div class="skill-chips">${chips.map(t=>`<span>${esc(t)}</span>`).join('')}</div></section>`:''}${data.email||data.phone?`<details class="private-contact"><summary>معلومات التواصل · خاصة</summary>${data.email?`<p dir="ltr">${esc(data.email)}</p>`:''}${data.phone?`<p dir="ltr">${esc(data.phone)}</p>`:''}<p>تختار ما يظهر للآخرين قبل النشر.</p></details>`:''}${!hasLearning&&!chips.length&&!data.email&&!data.phone?'<p class="profile-empty">تظهر هنا تفاصيل تعليمك وما تجيده، عندما تضيفها.</p>':''}</aside></div><div class="page-signature"><span>بكلامك أنت. وبصورة تليق بك.</span><span>أثَر</span></div></article>`}
function render(){normaliseProfile();app.className=step===5?'preview-mode':'';if(step===0){app.innerHTML=`<section class="hero"><div><span class="eyebrow">أنت أكثر من مسمى وظيفي</span><h1>عندك قصة.<br>خلّها تظهر.</h1><p>احكِ لنا عن شغلك وتجاربك بطريقتك.<br>ونساعدك ترتّب صفحة تعرف الناس عليك.</p><div class="actions"><button class="primary" id="start">خلّنا نتعرف عليك ←</button><a class="secondary" href="/profile" style="text-decoration:none">شاهد النتيجة أولًا</a>${data.work||data.name?'<button class="secondary" id="resume">أكمل مسودتي</button>':''}</div><p class="mini">بدون سيرة جاهزة. بدون خبرة تقنية. وعلى راحتك.</p></div><div class="portrait"><div class="preview-card"><span class="mini">مثال على اللي نقدر نوصله سوا</span><div class="monogram">س</div><h2>سارة</h2><p>أحب أساعد الناس يلقون اللي يناسبهم.</p><div class="chips"><span>قصتي</span><span>تجاربي</span><span>ما أفتخر به</span></div><hr style="border:0;border-top:1px solid #ddd;margin:25px 0"><p class="mini">«بدأت مع العملاء، وتعلمت إن الاستماع هو أول خطوة لحل أي مشكلة.»</p></div><div class="note">كل شخص عنده شيء يستحق ينقال.</div></div></section><div class="steps"><div><span>١</span> نحكي شوي</div><div><span>٢</span> نرتّب قصتك</div><div><span>٣</span> تشوف نفسك فيها</div></div>`;document.getElementById('start').onclick=()=>go(1);const r=document.getElementById('resume');if(r)r.onclick=()=>go(data.work?5:data.name?2:1);return}let c='';if(step===1)c=`<span class="eyebrow">نبدأ بالتعارف</span><h2>وش نحب نناديك؟</h2><label for="name">اسمك، بالطريقة اللي تحب تظهر فيها</label><input class="field" id="name" autocomplete="name" maxlength="80" value="${esc(data.name)}" placeholder="مثلاً: أحمد الشهري"><div class="actions"><button class="primary" id="next">تشرفنا، نكمل ←</button></div>`;if(step===2)c=`<span class="eyebrow">أهلًا ${esc(data.name)}</span><h2>وش ودّك صفحتك تساعدك فيه؟</h2><div class="options">${['ألقى فرصة عمل','أعرّف الناس بشغلي','أعرض تجربتي بشكل يليق بي'].map(t=>`<button class="option" data-goal="${t}">${t} ←</button>`).join('')}</div>`;if(step===3)c=`<span class="eyebrow">عن تجربتك</span><h2>وش تسوي في شغلك؟</h2><label for="work">تخيّل إنك تحكي لشخص يتعرف عليك لأول مرة.</label><textarea class="field" id="work" maxlength="3000" placeholder="مثلاً: أشتغل في محل، أساعد العملاء وأرتب المنتجات وأتابع طلباتهم…">${esc(data.work)}</textarea><p class="mini">مو لازم كلام رسمي. اكتب بطريقتك.</p><div class="actions"><button class="primary" id="next">هذا اللي أسويه ←</button></div>`;if(step===4)c=`<span class="eyebrow">الفرق اللي تتركه</span><h2>اذكر موقفًا تفتخر فيه.</h2><label for="moment">مساعدة قدمتها، مشكلة حليتها، أو شيء تعلمته.</label><textarea class="field" id="moment" maxlength="3000" placeholder="حتى المواقف الصغيرة تقول الكثير عنك…">${esc(data.moment)}</textarea><div class="actions"><button class="primary" id="next">نكمل القصة ←</button><button class="plain" id="skip">أضيفه بعدين</button></div>`;if(step===4.5)c=`<span class="eyebrow">نفهم دورك أكثر · اختياري</span><h2>وش سويت أنت بالتحديد؟</h2><p>حتى لو كنت ضمن فريق، احكِ عن الجزء اللي ساهمت فيه أنت.</p><details><summary>أرجع للموقف اللي كتبته</summary><p class="original">${esc(data.moment)}</p></details><label for="momentDetail">إضافة بسيطة تكفي، وإذا وضّحت دورك من قبل تقدر تتجاوز.</label><textarea class="field" id="momentDetail" maxlength="1500" placeholder="مثلاً: سمعت من العميل، راجعت الطلب، وتابعت مع الفريق…">${esc(data.momentDetail)}</textarea><div class="actions"><button class="primary" id="next">أضيف توضيحي وأشوف صفحتي ←</button><button class="plain" id="skip-detail">أكمل بدون إضافة</button></div>`;if(step===6)c=profileQuestion('وش آخر دور اشتغلت فيه؟','exp-role','اكتب اسم الدور بطريقتك. تقدر تذكر عملًا سابقًا أو تطوعًا أو مشروعًا شخصيًا.',120);
if(step===7)c=profileQuestion('وين كانت هذه التجربة؟','exp-organization','اسم الجهة أو المشروع، أو اتركها فارغة إذا تفضّل.',150);
if(step===8)c=profileQuestion('متى كانت هذه التجربة؟','exp-period','مثل: ٢٠٢٣ إلى الآن، أو خلال الصيف. لا تحتاج تخمّن تاريخًا.',100);
if(step===9)c=profileQuestion('وش كنت تسوي في هذا الدور؟','exp-description','اذكر مسؤولياتك أو مساهمتك بكلامك أنت.',2000);
if(step===10)c=`<span class="eyebrow">خبراتك حتى الآن</span><h2>كل تجربة لها مكان.</h2>${data.experiences.length?data.experiences.map((e,i)=>`<article class="rewrite"><h3>${esc(e.role)}</h3><p>${esc([e.organization,e.period].filter(Boolean).join(' · '))}</p><p>${esc(e.description)}</p><button class="plain" data-edit-exp="${i}">أعدّل هذه التجربة</button><button class="plain" data-remove-exp="${i}">أزيلها من مسودتي</button></article>`).join(''):'<p>تقدر تكمل بدون خبرة وظيفية وتعرض دراستك ومشاريعك.</p>'}<div class="actions"><button class="primary" id="education-next">نكمل للتعليم ←</button><button class="secondary" id="add-exp" ${data.experiences.length>=10?'disabled':''}>أضيف تجربة ثانية</button></div>`;
if(step===11)c=profileQuestion('وش درست أو وش تتعلم الآن؟','education','المؤهل والتخصص والجهة، وقل لنا إذا كنت ما زلت تدرس.');
if(step===12)c=profileQuestion('فيه دورة أو تدريب ودّك تذكره؟','courses','اذكر الاسم والجهة إذا تعرفها. التعلّم الذاتي له مكان أيضًا، بدون اعتباره شهادة.');
if(step===13)c=profileQuestion('وش الأشياء اللي تجيدها؟','skills','مثل: متابعة الطلبات، شرح الأفكار أو استخدام برنامج معين. اذكر مثالًا بسيطًا إذا تقدر.');
if(step===14)c=profileQuestion('على أي بريد تحب يتواصلون معك؟','email','اختياري. يبقى خاصًا في مسودتك إلى أن تختار إظهاره.',254,'email');
if(step===15)c=profileQuestion('تحب تضيف رقم للتواصل؟','phone','اختياري. لن يظهر للعامة تلقائيًا.',30,'tel');
if(step===16)c=profileQuestion('في أي مدينة تفضّل تكون فرصتك؟','city','اكتب مدينتك أو المدن المناسبة لك، أو اتركها مفتوحة.',120);
if(step===5)c=`<div class="preview-intro"><div><span class="eyebrow">من كلامك، إلى حضور يشبهك</span><h2>هذه صفحتك المهنية.</h2></div><span class="private-badge">معاينة خاصة · لك وحدك</span></div>${professionalPreview()}<p class="preview-note">المعلومات معروضة كما اخترتها. راجعها وعدّلها على راحتك؛ لم تُنشر صفحتك للعامة.</p><div class="actions preview-actions"><button class="primary" id="complete-profile">أكمل تفاصيل صفحتي</button><button class="secondary" id="edit">أعدّل قصتي</button><button class="secondary" id="confirm">احفظ مسودتي هنا</button><button class="plain" id="print">اطبع صفحتي</button></div><p class="status" id="saved" aria-live="polite">نسخة عرض · مسودتك في هذا المتصفح فقط. يمكنك تعديلها وطباعة صفحتك.</p>`;app.innerHTML=shell(c);bindProfile();if(step===3||step===4){const field=step===3?'work':'moment';document.getElementById(field).insertAdjacentHTML('afterend','<div id="rewrite-panel"></div>');paintRewrite(field)}document.getElementById('back').onclick=()=>{capture();go(step===6?5:step===10?5:step===11?10:step===4.5?4:step===5&&data.moment.trim()?4.5:step-1)};app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{data.goal=b.dataset.goal;save();go(3)});let n=document.getElementById('next');if(n)n.onclick=()=>{capture();if(step===1&&!data.name.trim()||step===3&&!data.work.trim()){document.getElementById('error').textContent='اكتب إجابة بسيطة عشان نكمل معك.';return}go(step===4?(data.moment.trim()?4.5:5):step===4.5?5:step+1)};let sk=document.getElementById('skip');if(sk)sk.onclick=()=>{capture();go(5)};let sd=document.getElementById('skip-detail');if(sd)sd.onclick=()=>{capture();data.momentDetail='';save();go(5)};let edit=document.getElementById('edit');if(edit)edit.onclick=()=>go(3);let conf=document.getElementById('confirm');if(conf)conf.onclick=()=>document.getElementById('saved').textContent=save()?'حُفظت مسودتك في هذا المتصفح. تقدر ترجع تكملها هنا.':'تعذّر الحفظ في المتصفح. يمكنك طباعة صفحتك للاحتفاظ بها.';let pr=document.getElementById('print');if(pr)pr.onclick=()=>window.print();app.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',capture))}function capture(){['name','work','moment','momentDetail','education','courses','skills','email','phone','city'].forEach(k=>{let e=document.getElementById(k);if(e&&data[k]!==e.value){data[k]=e.value;if(k==='moment')data.momentDetail='';if(k==='work'||k==='moment'){const w=wording(k);w.original=e.value;w.suggestion='';w.approved='';w.question='';w.followup='';w.error='';paintRewrite(k)}}});for(const k of ['role','organization','period','description']){const e=document.getElementById('exp-'+k);if(e)data.experienceDraft[k]=e.value}save()}function go(n){if(activeRewrite){activeRewrite.abort();activeRewrite=null}step=n;render();window.scrollTo({top:0,behavior:'smooth'});}document.getElementById('home').onclick=()=>{capture();go(0)};
let editingExperience=Number.isInteger(data.experienceEditingIndex)?data.experienceEditingIndex:null;
function bindProfile(){const bind=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};bind('complete-profile',()=>{normaliseProfile();editingExperience=Number.isInteger(data.experienceEditingIndex)?data.experienceEditingIndex:null;go(data.experienceDraft.role?6:data.experiences.length?10:6)});bind('education-next',()=>go(11));bind('add-exp',()=>{editingExperience=null;data.experienceEditingIndex=null;data.experienceDraft={role:'',organization:'',period:'',description:''};save();go(6)});
const advance=()=>{capture();if(step===6&&!data.experienceDraft.role.trim()){document.getElementById('error').textContent='اكتب اسم الدور، أو اختر «أضيفها بعدين».';return}if(step===14&&data.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email)){document.getElementById('error').textContent='راجع صيغة البريد، أو اتركه فارغًا.';return}if(step===9&&!data.experienceDraft.role.trim()){go(6);return}if(step===9){const entry={...data.experienceDraft};if(editingExperience!==null)data.experiences[editingExperience]=entry;else if(data.experiences.length<10)data.experiences.push(entry);editingExperience=null;data.experienceEditingIndex=null;data.experienceDraft={role:'',organization:'',period:'',description:''};save()}go(step===16?5:step+1)};
bind('profile-next',advance);bind('profile-skip',()=>{capture();if(step>=6&&step<=9){if(step===6){editingExperience=null;go(11)}else advance()}else go(step===16?5:step+1)});
app.querySelectorAll('[data-edit-exp]').forEach(e=>e.onclick=()=>{editingExperience=Number(e.dataset.editExp);data.experienceEditingIndex=editingExperience;data.experienceDraft={...data.experiences[editingExperience]};save();go(6)});app.querySelectorAll('[data-remove-exp]').forEach(e=>e.onclick=()=>{data.experiences.splice(Number(e.dataset.removeExp),1);save();render()})}
let activeRewrite=null, aiReady=false;
function wording(k){if(!data.wording[k]||typeof data.wording[k]!=='object')data.wording[k]={original:data[k],suggestion:'',approved:'',question:'',followup:''};return data.wording[k]}
function paintRewrite(k){const panel=document.getElementById('rewrite-panel');if(!panel)return;const w=wording(k);panel.innerHTML=`<section class="rewrite" aria-label="ترتيب الكلام"><h3>نرتّب كلامك؟</h3><p class="mini">باختيار التحسين، نرسل هذا النص فقط إلى OpenAI لصياغة اقتراح بالذكاء الاصطناعي. أنت تراجع وتقرر.</p>${!aiReady?'<p class="mini">التحسين غير متاح حاليًا. تقدر تكمل بكلامك أو تعدّله بنفسك.</p>':''}<button class="secondary" id="rewrite" ${!aiReady||activeRewrite?'disabled':''}>${activeRewrite?'نرتّب كلامك…':'حسّن صياغتي'}</button><p role="status" class="error">${esc(w.error||'')}</p>${w.question?`<label for="followup">${esc(w.question)}</label><input id="followup" class="field" maxlength="500" value="${esc(w.followup||'')}" placeholder="اكتب توضيحًا بسيطًا"><button id="answer-followup" class="secondary" ${activeRewrite?'disabled':''}>أضف توضيحي للاقتراح</button>`:''}${w.suggestion?`<p class="mini">كلامك الأصلي</p><p class="original">${esc(w.original)}</p><label for="suggestion">الاقتراح · تقدر تعدّله قبل الاعتماد</label><textarea class="field" id="suggestion" maxlength="3000">${esc(w.suggestion)}</textarea><div class="actions"><button class="primary" id="accept">هذا يعبّر عني</button><button class="secondary" id="simplify" ${!aiReady||activeRewrite?'disabled':''}>خلّه أبسط</button><button class="plain" id="original">أفضّل كلامي</button></div>`:w.approved?'<p class="mini">أنت اعتمدت الصياغة الحالية.</p><button class="plain" id="original">أرجع لكلامي الأصلي</button>':''}</section>`;
const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};bind('rewrite',()=>rewrite(k,false));bind('simplify',()=>rewrite(k,true));bind('answer-followup',()=>rewrite(k,false));let f=document.getElementById('followup');if(f)f.oninput=()=>{w.followup=f.value;save()};let t=document.getElementById('suggestion');if(t)t.oninput=()=>{w.suggestion=t.value;save()};bind('accept',()=>{if(!w.suggestion.trim())return;data[k]=w.suggestion.trim();w.approved=data[k];w.suggestion='';w.question='';save();document.getElementById(k).value=data[k];paintRewrite(k)});bind('original',()=>{data[k]=w.original;w.suggestion='';w.approved='';w.question='';save();document.getElementById(k).value=data[k];paintRewrite(k)})}
async function rewrite(k,simple){if(activeRewrite)return;capture();const w=wording(k);if(!w.original.trim()){w.error='اكتب كلامك أولًا، ولو بجملة بسيطة.';paintRewrite(k);return}const sourceText=w.original;const ctrl=new AbortController();activeRewrite=ctrl;w.error='';paintRewrite(k);const timer=setTimeout(()=>ctrl.abort(),25000);try{const response=await fetch('/api/rewrite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({field:k,original:w.original,followup:w.followup||'',simple}),signal:ctrl.signal});const result=await response.json();if(!response.ok)throw Error(result.message||'تعذّر التحسين الآن. كلامك موجود وتقدر تكمل به.');if(ctrl.signal.aborted||w.original!==sourceText)return;w.suggestion=result.suggestion||'';w.question=result.question||'';save()}catch(e){if(activeRewrite===ctrl)w.error=e.name==='AbortError'?'تأخر الرد. كلامك موجود؛ تقدر تعيد المحاولة أو تكمل به.':e.message}finally{clearTimeout(timer);if(activeRewrite===ctrl){activeRewrite=null;paintRewrite(k)}}}
Promise.resolve({ok:true,json:async()=>({ready:false})}).then(r=>r.ok?r.json():null).then(r=>{aiReady=r?.ready===true;if(step===3||step===4)paintRewrite(step===3?'work':'moment')}).catch(()=>{});

const cloud={available:false,authenticated:false,revision:null,draft:null,busy:false,message:'نتحقق من الحفظ في حسابك…',accountId:null};
const hasRecovery=()=>{try{return !!localStorage.getItem('athar-draft-recovery-v1')}catch{return false}};
const hasDraft=()=>!!(data.name||data.work||data.moment);
function cloudPanel(){document.getElementById('account-draft').innerHTML=`<h3>نسخة العرض العملي</h3><p>تقدر تجرّب كتابة بياناتك ومعاينة صفحتك. تحفظ هذه النسخة مسودتك في هذا المتصفح فقط. الحفظ في الحساب وإعادة الصياغة بالذكاء الاصطناعي غير مفعّلين هنا.</p><div class="actions"><a class="secondary" href="/profile">شاهد بروفايلًا تجريبيًا مكتملًا</a><a class="plain" href="https://athar-story.poisedabbey.chatgpt.site">افتح نسخة العمل الخاصة</a></div>`}
async function cloudRefresh(){try{const r=await fetch('/api/draft');const v=await r.json();cloud.authenticated=v.authenticated===true;cloud.available=r.ok&&v.available===true;if(!cloud.available){cloud.message=v.message||'الحفظ في الحساب غير متاح الآن. تقدر تكمل محليًا.';return}cloud.accountId=v.accountId;cloud.revision=v.revision;cloud.draft=v.draft;
// Local drafts remain local until the user explicitly saves or loads.
cloud.message=v.draft?'لديك مسودة في حسابك. اختر فتحها أو حفظ المسودة الحالية.':'تقدر تحفظ مسودتك في حسابك وتفتحها من جهاز آخر.';
if(data.accountId&&data.accountId!==cloud.accountId){localStorage.setItem('athar-draft-account-backup',JSON.stringify(data));data={name:'',goal:'',work:'',moment:'',momentDetail:'',headline:'',wording:{}};save();step=0;render();cloud.message='هذه مساحة حسابك الحالي. مسودة الحساب السابق لم تُرفع إلى هذا الحساب.'}
}catch{cloud.message='تعذّر الوصول لحسابك. مسودتك المحلية باقية.'}finally{cloudPanel()}}
function cloudLoad(){if(cloud.busy||!cloud.draft)return;capture();try{localStorage.setItem('athar-draft-recovery-v1',JSON.stringify(data))}catch{cloud.message='تعذّر الاحتفاظ بنسخة من المسودة الحالية؛ لم نستبدلها.';cloudPanel();return}data={...cloud.draft,accountId:cloud.accountId};data.wording=data.wording||{};normaliseProfile();save();go(data.work?5:1);cloud.message='فتحت مسودة حسابك. احتفظنا بنسخة من مسودتك السابقة في هذا المتصفح.';cloudPanel()}
async function cloudSave(){if(cloud.busy||!cloud.available)return;capture();if(!hasDraft()){cloud.message='ابدأ بكتابة اسمك أو تجربتك أولًا.';cloudPanel();return}const snapshot=JSON.stringify(data);cloud.busy=true;cloud.message='نحفظ نسخة خاصة في حسابك…';cloudPanel();try{const r=await fetch('/api/draft',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({revision:cloud.revision,draft:data}),signal:AbortSignal.timeout(20000)});const v=await r.json();if(r.status===409){const latest=await fetch('/api/draft').then(r=>r.json());cloud.draft=latest.draft;cloud.revision=latest.revision;throw Error('في حسابك نسخة أحدث. مسودتك الحالية باقية هنا؛ افتح نسخة الحساب لمراجعتها، أو اضغط الحفظ مرة ثانية لاستبدالها بنسختك الحالية.')}if(!r.ok)throw Error(v.message||'تعذّر الحفظ في حسابك.');cloud.revision=v.revision;cloud.draft=JSON.parse(snapshot);data.accountId=cloud.accountId;save();cloud.message=JSON.stringify({...data,accountId:undefined})===JSON.stringify({...JSON.parse(snapshot),accountId:undefined})?'حُفظت مسودتك في حسابك. تقدر تفتحها من جهاز آخر بعد تسجيل الدخول.':'حُفظت النسخة التي أرسلتها. عندك تعديلات أحدث في المتصفح؛ احفظها إذا انتهيت.'}catch(e){cloud.message=e.name==='TimeoutError'?'تأخر الحفظ. مسودتك المحلية باقية؛ جرّب لاحقًا.':e.message}finally{cloud.busy=false;cloudPanel()}}
cloudPanel();
render();
</script></body></html>
