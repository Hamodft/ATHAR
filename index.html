const app=document.getElementById('app');let data={name:'',goal:'',work:'',moment:'',momentDetail:'',headline:'',layout:'portfolio',theme:'navy'},step=0;try{Object.assign(data,JSON.parse(localStorage.getItem('athar-draft-v1')||'{}'))}catch(e){};data.wording=data.wording&&typeof data.wording==='object'?data.wording:{};['name','goal','work','moment','momentDetail'].forEach(k=>{if(typeof data[k]!=='string')data[k]=''});const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('athar-draft-v1',JSON.stringify(data));document.getElementById('save-warning').hidden=true;return true}catch(e){document.getElementById('save-warning').hidden=false;return false}}function shell(content){return `<section class="flow"><button class="plain" id="back">→ رجوع</button><div class="progress" role="progressbar" aria-label="تقدم التجربة" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(step<=5?step/5*100:(step-5)/11*100)}"><i style="transform:scaleX(${step<=5?step/5:(step-5)/11})"></i></div>${content}<p class="error" id="error" role="alert"></p></section>`}function normaliseProfile(){for(const k of ['education','courses','skills','email','phone','city'])if(typeof data[k]!=='string')data[k]='';if(!Array.isArray(data.experiences))data.experiences=[];if(!data.experienceDraft||typeof data.experienceDraft!=='object')data.experienceDraft={};for(const k of ['role','organization','period','description'])if(typeof data.experienceDraft[k]!=='string')data.experienceDraft[k]=''}

let previewLanguage='ar';function professionalPreview(){return window.AtharRenderer.render(data,window.atharPhotoUrl||'',false,previewLanguage)}function render(){normaliseProfile();app.className=step===5?'preview-mode':'';document.body.dataset.screen=step===0?'landing':'editor';if(step===0){app.innerHTML=`<section class="hero"><div><span class="eyebrow">أنت أكثر من مسمى وظيفي</span><h1>عندك قصة.<br>خلّها تظهر.</h1><p>احكِ لنا عن شغلك وتجاربك بطريقتك.<br>ونساعدك ترتّب صفحة تعرف الناس عليك.</p><div class="actions"><button class="primary" id="start">خلّنا نتعرف عليك ←</button><a class="secondary" href="/import-cv" style="text-decoration:none">استورد سيرتك الجاهزة ⇧</a><a class="secondary" href="/profile" style="text-decoration:none">شاهد النتيجة أولًا</a>${data.work||data.name?'<button class="secondary" id="resume">أكمل مسودتي</button>':''}</div><p class="mini">بدون سيرة جاهزة. بدون خبرة تقنية. وعلى راحتك.</p></div><div class="portrait"><div class="preview-card"><span class="mini">مثال على اللي نقدر نوصله سوا</span><div class="monogram">س</div><h2>سارة</h2><p>أحب أساعد الناس يلقون اللي يناسبهم.</p><div class="chips"><span>قصتي</span><span>تجاربي</span><span>ما أفتخر به</span></div><hr style="border:0;border-top:1px solid #ddd;margin:25px 0"><p class="mini demo-story" id="demo-text" aria-live="polite" aria-atomic="true">أساعد العملاء يختارون اللي يناسبهم، وأتابع طلباتهم لين توصل.</p><div class="demo-actions"><button type="button" data-demo="work" aria-pressed="true">كلام سارة</button><button type="button" data-demo="story" aria-pressed="false">مساهمتها</button></div></div><div class="note">كل شخص عنده شيء يستحق ينقال.</div></div></section><div class="steps"><div><span>١</span> نحكي شوي</div><div><span>٢</span> نرتّب قصتك</div><div><span>٣</span> تشوف نفسك فيها</div></div>`;document.getElementById('start').onclick=()=>go(1);app.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{app.querySelectorAll('[data-demo]').forEach(x=>x.setAttribute('aria-pressed',String(x== if(step===16)c=profileQuestion('في أي مدينة تفضّل تكون فرصتك؟','city','اكتب مدينتك أو المدن المناسبة لك، أو اتركها مفتوحة.',120);
if(step===5)c=`<div class="preview-intro"><div><span class="eyebrow">من كلامك، إلى حضور يشبهك</span><h2>هذه صفحتك المهنية.</h2></div><span class="private-badge">معاينة خاصة · لك وحدك</span></div>${professionalPreview()}<p class="preview-note">المعلومات معروضة كما اخترتها. راجعها وعدّلها على راحتك؛ لم تُنشر صفحتك للعامة.</p><div class="actions preview-actions"><button class="primary" id="complete-profile">أكمل تفاصيل صفحتي</button><a class="secondary" href="/design">عدّل تصميم صفحتي</a><button class="secondary" id="edit">أعدّل قصتي</button><button class="secondary" id="confirm">احفظ مسودتي هنا</button><button class="plain" id="print">اطبع صفحتي</button></div><p class="status" id="saved" aria-live="polite">مسودتك خاصة. استخدم حفظ الحساب لاستكمالها من جهاز آخر.</p>`;c=c.replace(/<h2>(.*?)<\/h2>/,'<h1>$1</h1>');app.innerHTML=shell(c);bindProfile();window.AtharRenderer.bind(app,data,window.atharPhotoUrl||'',false,language=>{previewLanguage=language});if(step===3||step===4){const field=step===3?'work':'moment';document.getElementById(field).insertAdjacentHTML('afterend','<div id="rewrite-panel"></div>');paintRewrite(field)}document.getElementById('back').onclick=()=>{capture();go(step===6?5:step===10?5:step===11?10:step===4.5?4:step===5&&data.moment.trim()?4.5:step-1)};app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{data.goal=b.dataset.goal;save();go(3)});let n=document.getElementById('next');if(n)n.onclick=()=>{capture();if(step===1&&!data.name.trim()||step===3&&!data.work.trim()){document.getElementById('error').textContent='اكتب إجابة بسيطة عشان نكمل معك.';return}go(step===4?(data.moment.trim()?4.5:5):step===4.5?5:step+1)};let sk=document.getElementById('skip');if(sk)sk.onclick=()=>{capture();go(5)};let sd=document.getElementById('skip-detail');if(sd)sd.onclick=()=>{capture();data.momentDetail='';save();go(5)};let edit=document.getElementById('edit');if(edit)edit.onclick=()=>go(3);let conf=document.getElementById('confirm');if(conf)conf.onclick=()=>docume function paintRewrite(k){const panel=document.getElementById('rewrite-panel');if(!panel)return;const w=wording(k);panel.innerHTML=`<section class="rewrite" aria-label="ترتيب الكلام"><h3>نرتّب كلامك؟</h3><p class="mini">باختيار التحسين، نرسل هذا النص فقط إلى OpenAI عبر Vercel AI Gateway لصياغة اقتراح بالذكاء الاصطناعي. أنت تراجع وتقرر.</p>${!aiReady?'<p class="mini">التحسين غير متاح حاليًا. تقدر تكمل بكلامك أو تعدّله بنفسك.</p>':''}<button class="secondary" id="rewrite" ${!aiReady||activeRewrite?'disabled':''}>${activeRewrite?'نرتّب كلامك…':'حسّن صياغتي'}</button><p role="status" class="error">${esc(w.error||'')}</p>${w.question?`<label for="followup">${esc(w.question)}</label><input id="followup" class="field" maxlength="500" value="${esc(w.followup||'')}" placeholder="اكتب توضيحًا بسيطًا"><button id="answer-followup" class="secondary" ${activeRewrite?'disabled':''}>أضف توضيحي للاقتراح</button>`:''}${w.suggestion?`<p class="mini">كلامك الأصلي</p><p class="original">${esc(w.original)}</p><label for="suggestion">الاقتراح · تقدر تعدّله قبل الاعتماد</label><textarea class="field" id="suggestion" maxlength="3000">${esc(w.suggestion)}</textarea><div class="actions"><button class="primary" id="accept">هذا يعبّر عني</button><button class="secondary" id="simplify" ${!aiReady||activeRewrite?'disabled':''}>خلّه أبسط</button><button class="plain" id="original">أفضّل كلامي</button></div>`:w.approved?'<p class="mini">أنت اعتمدت الصياغة الحالية.</p><button class="plain" id="original">أرجع لكلامي الأصلي</button>':''}</section>`;
const bind=(id,fn)=>{const el=document.getElementById(id);if(el)el.onclick=fn};bind('rewrite',()=>rewrite(k,false));bind('simplify',()=>rewrite(k,true));bind('answer-followup',()=>rewrite(k,false));let f=document.getElementById('followup');if(f)f.oninput=()=>{w.followup=f.value;save()};let t=document.getElementById('suggestion');if(t)t.oninput=()=>{w.suggestion=t.value;save()};bind('accept',()=>{if(!w.suggestion.trim())return;data[k]=w.suggestion.trim();w.approved=data[k];w.suggestion='';w.question='';save();document.getElementById(k).value=data[k];paintRewrite(k)});bind('original',()=>{data[k]=w.original;w.suggestion='';w.approved='';w.question='';save();document.getElementById(k).value=data[k];paintRewrite(k)})}
async function rewrite(k,simple){if(activeRewrite)return;capture();const w=wording(k);if(!w.original.trim()){w.error='اكتب كلامك أولًا، ولو بجملة بسيطة.';paintRewrite(k);return}const sourceText=w.original;const ctrl=new AbortController();activeRewrite=ctrl;w.error='';paintRewrite(k);const timer=setTimeout(()=>ctrl.abort(),25000);try{const response=await fetch('/api/rewrite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({field:k,original:w.original,followup:w.followup||'',simple}),signal:ctrl.signal});const result=await response.json();if(!response.ok)throw Error(result.message||'تعذّر التحسين الآن. كلامك موجود وتقدر تكمل به.');if(ctrl.signal.aborted||w.original!==sourceText)return;w.suggestion=result.suggestion||'';w.question=result.question||'';save()}catch(e){if(activeRewrite===ctrl)w.error=e.name==='AbortError'?'تأخر الرد. كلامك موجود؛ تقدر تعيد المحاولة أو تكمل به.':e.message}finally{clearTimeout(timer);if(activeRewrite===ctrl){activeRewrite=null;paintRewrite(k)}}}
fetch('/api/config', {cache:'no-store'}).then(r=>r.ok?r.json():null).then(r=>{aiReady=r?.ready===true;if(step===3||step===4)paintRewrite(step===3?'work':'moment')}).catch(()=>{});

const hasRecovery=()=>{try{return !!localStorage.getItem('athar-draft-recovery-v1')}catch{return false}};
if(data.accountId)app.innerHTML='<p role="status" style="text-align:center;padding:60px">نتحقق من حسابك قبل فتح مسودتك…</p>';else render();
